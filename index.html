<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Twitch TV</title>
<link rel="icon" href="icons/icon-square.png">
<link rel="stylesheet" href="css/app.css?v=17">
</head>
<body>
<div id="splash">
  <div class="splash-logo"><svg viewBox="0 0 24 24"><path d="M2.149 0 .537 4.119v16.836h5.731V24h3.224l3.045-3.045h4.657l6.269-6.269V0H2.149zm19.164 13.612-3.582 3.582H12l-3.045 3.045v-3.045H4.119V2.149h17.194v11.463zm-3.582-7.343v6.262h-2.149V6.269h2.149zm-5.731 0v6.262H9.851V6.269H12z"/></svg></div>
  <div class="splash-word">twitch</div>
  <div class="splash-bar"><i></i></div>
</div>
<div id="app">
  <nav id="sidebar" class="sidebar"></nav>
  <main id="pages"></main>

  <div id="player" class="player hidden">
    <div class="player-stage">
      <div class="video-box"><video id="video" playsinline preload="auto"></video></div>
      <aside id="chat" class="chat hidden">
        <div class="chat-head"><span class="chat-title" data-i18n>Чат</span><span class="chat-state"></span></div>
        <div class="chat-list"></div>
      </aside>
    </div>
    <div class="player-spinner hidden"><div class="spinner"></div></div>
    <div class="player-message hidden"></div>
    <div class="player-osd">
      <div class="osd-top">
        <img class="osd-avatar" alt="">
        <div class="osd-meta">
          <div class="osd-title"></div>
          <div class="osd-sub"></div>
        </div>
      </div>
      <div class="osd-bottom">
        <div class="osd-progress">
          <div class="osd-live-badge" data-i18n>В ЭФИРЕ</div>
          <div class="osd-time osd-time-cur"></div>
          <div class="osd-bar"><div class="osd-bar-buf"></div><div class="osd-bar-fill"></div><div class="osd-bar-knob"></div></div>
          <div class="osd-time osd-time-dur"></div>
        </div>
        <div class="osd-controls"></div>
        <div class="osd-next">
          <div class="osd-next-title"></div>
          <div class="shelf-viewport"><div class="shelf-track" data-group="next"></div></div>
        </div>
      </div>
    </div>
    <div class="player-stats hidden"></div>
    <div class="player-zap hidden"></div>
  </div>

  <div id="modal-root"></div>
  <div id="toast" class="toast hidden"></div>
</div>

<script>window.APP_V = '17';</script>
<script src="js/vendor/hls.min.js?v=1.5.20"></script>
<script src="js/util.js?v=17"></script>
<script src="js/i18n.js?v=17"></script>
<script src="js/twitch.js?v=17"></script>
<script src="js/auth.js?v=17"></script>
<script src="js/vendor/qrcode.js?v=1.4.4"></script>
<script src="js/nav.js?v=17"></script>
<script src="js/ui.js?v=17"></script>
<script src="js/chat.js?v=17"></script>
<script src="js/player.js?v=17"></script>
<script src="js/events.js?v=17"></script>
<script src="js/pages.js?v=17"></script>
<script src="js/app.js?v=17"></script>
</body>
</html>
